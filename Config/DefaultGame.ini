[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=F3A4BFE947ED2A020FC3ED80B0EF095D

[/Script/ShowDown.SDLLMSubsystem]
bEnableOpenAI=True
Model=gpt-5.6-terra
ApiKeyEnvironmentVariable=OPENAI_API_KEY
; 무료 Gemini 키(aistudio.google.com)를 GEMINI_API_KEY 환경변수나 게임 폴더의 LLMKey.txt에 넣으면 사용합니다.
; 키가 없거나 네트워크가 막히면 대본 대사로 대답합니다.
Provider=Gemini
; 앞에서부터 사용하고, 실패하면 다음 대화부터 다음 모델로 넘어갑니다. 무료 한도(429)를 넘긴 모델은 그 실행 동안 제외합니다.
; 무료 하루 한도(2026-11-02 AI Studio 기준): Gemma 4 26B 14,400회(약 1.8초) / 3.1 Flash Lite 500회 / 3.x Flash 20회.
; 한도는 매일 미국 태평양 자정(한국 오후 4~5시)에 초기화됩니다.
!GeminiModelCandidates=ClearArray
+GeminiModelCandidates=gemma-4-26b-a4b-it
+GeminiModelCandidates=gemini-3.1-flash-lite
+GeminiModelCandidates=gemini-3.5-flash
; 모델별 무료 한도. 게임이 분당 요청/분당 토큰/하루 요청을 직접 세어 QuotaSafetyRatio(85%) 안에서만 보냅니다.
; 한 모델이 꽉 차면 다음 모델로 넘기고, 모두 꽉 찼을 때만 대본 대사로 대답합니다.
!GeminiModelLimits=ClearArray
+GeminiModelLimits=(Model="gemma-4-26b-a4b-it",RPM=30,RPD=14400,TPM=16000)
+GeminiModelLimits=(Model="gemini-3.1-flash-lite",RPM=15,RPD=500,TPM=250000)
+GeminiModelLimits=(Model="gemini-3.5-flash",RPM=5,RPD=20,TPM=250000)
QuotaSafetyRatio=0.85
GeminiApiKeyEnvironmentVariable=GEMINI_API_KEY
ApiKeyFileName=LLMKey.txt
; 베팅 결정은 규칙 기반 AI로 즉시 처리하고, LLM은 채팅/결과 대사에만 사용합니다(무료 한도 절약).
bUseLLMForBetDecisions=False
bUseScriptedChatFallback=True
RequestTimeoutSeconds=8.000000
bEnableInstantBossChatReply=True
bAllowOverlappingBossChatReplies=False
BossChatReplyCooldownSeconds=3.000000

BossSpeechStylePrompt=Speak natural Korean banmal like a mature Korean man in his twenties across the table: casual and current, never boyish, cutesy, overeager, or slang-heavy. Stay relaxed and streetwise without forcing menace, profanity, game metaphors, or catchphrases. Respond to the player's intent, vary your phrasing, and never sound like a scripted villain.

